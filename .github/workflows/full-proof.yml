name: Re-run full proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install numpy numba
      - name: Run all representative branches
        run: python -c "from proof.prove_first_player import run_proof; ok,_=run_proof(workers=4, checkpoint_path='proof-output-v6.json', previous_checkpoint_path=None); raise SystemExit(0 if ok else 1)"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: proof-output-v6
          path: proof-output-v6.json
          if-no-files-found: warn
